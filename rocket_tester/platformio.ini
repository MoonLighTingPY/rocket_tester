; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examplesmobile
; https://docs.platformio.org/page/projectconf.html
[env:esp32-s3-eth-poe]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

upload_protocol = esptool
monitor_filters = esp32_exception_decoder
board_build.psram = disabled

build_flags = 
    -DARDUINO_ESP32S3_DEV
    -DBOARD_HAS_PSRAM
    -DCONFIG_ETH_USE_ESP32_EMAC=y
    

lib_deps =
    https://github.com/me-no-dev/ESPAsyncWebServer
    ArduinoJson
    WebSockets
    adafruit/Adafruit BusIO @ ^1.14.5
    rlogiacco/CircularBuffer @ ^1.3.3
    adafruit/Adafruit MAX31855 library @ ^1.4.2
    https://github.com/CuriousScientist0/ADS1256.git
    https://github.com/ciorceri/ADS1232.git