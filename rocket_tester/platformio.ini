[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.03/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
platform_packages = tool-esptoolpy @ https://github.com/pioarduino/esptool/releases/download/v5.0.1/esptool.zip

; Board-specific settings for Waveshare ESP32-S3-ETH
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Serial configuration
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags = 
    -DCORE_DEBUG_LEVEL=5
    ; -DBOARD_HAS_PSRAM
    ; -mfix-esp32-psram-cache-issue
    ; -DUSE_ETHERNET
    ; -DUSE_W5500
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
upload_speed = 921600

lib_deps =
    https://github.com/me-no-dev/ESPAsyncWebServer
    ArduinoJson
    WebSockets
    adafruit/Adafruit BusIO @ ^1.14.5
    rlogiacco/CircularBuffer @ ^1.3.3
    adafruit/Adafruit MAX31855 library @ ^1.4.2
    https://github.com/CuriousScientist0/ADS1256.git
    https://github.com/ciorceri/ADS1232.git
    https://github.com/Networking-for-Arduino/EthernetESP32.git
    https://github.com/adafruit/MAX6675-library.git